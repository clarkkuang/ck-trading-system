name: Tencent exit monitor

on:
  schedule:
    - cron: "47 8 * * 1"   # Mondays, staggered 30min after intc
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal deps
        run: pip install polars pyarrow pydantic pydantic-settings yfinance
      - name: Run weekly update
        run: PYTHONPATH=src python scripts/tcnt_monitor_update.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/monitoring/tcnt || true
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "chore(tcnt): weekly exit-monitor update"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
